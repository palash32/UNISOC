    <path d="M 27 18 Q 23 22 21 30 Q 20 37 22 48 Q 24 58 30 65 L 30 23 Q 29 20 27 18 Z" fill="#00B8D4" opacity="0.8"/>
    <path d="M 35 22 Q 32 26 31 33 Q 30 40 32 50 Q 34 58 38 63 L 38 26 Q 37 23 35 22 Z" fill="#00B8D4" opacity="0.6"/>
    
    <!-- U shape -->
    <rect x="45" y="15" width="15" height="65" rx="2" fill="#0066CC"/>
    <rect x="75" y="15" width="15" height="65" rx="2" fill="#0066CC"/>
    <path d="M 45 80 Q 67.5 92 90 80 L 90 65 Q 67.5 75 45 65 Z" fill="#0066CC"/>
  </g>
  
  <!-- Text: niSpark Innovation -->
  <g id="text" fill="#0066CC">
