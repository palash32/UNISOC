    <text x="250" y="52" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="400" letter-spacing="-0.3">Innovation</text>
    
    <!-- THE SOLUTION COMPANY -->
    <text x="185" y="72" font-family="Arial, Helvetica, sans-serif" font-size="9" font-weight="400" letter-spacing="2" fill="#0066CC">THE SOLUTION COMPANY</text>
  </g>
